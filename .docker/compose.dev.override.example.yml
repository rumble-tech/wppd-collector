services:
  app:
    environment:
      TZ: YOUR_TIMEZONE_HERE
      LOG_LEVEL: YOUR_LOG_LEVEL_HERE
      CORS_WHITELIST: YOUR_COMMA_SEPARATED_LIST_OF_ALLOWED_DOMAINS_HERE
      MAILING_SES_REGION: YOUR_AWS_SES_REGION_HERE
      MAILING_SES_ACCESS_KEY_ID: YOUR_AWS_SES_ACCESS_KEY_ID_HERE
      MAILING_SES_ACCESS_KEY_SECRET: YOUR_AWS_SES_SECRET_ACCESS_KEY_HERE
      MAILING_REPORT_ENABLED: YOUR_MAILING_REPORT_ENABLED_TRUE_OR_FALSE_HERE
      MAILING_REPORT_SENDER: YOUR_REPORT_SENDER_EMAIL_HERE
      MAILING_REPORT_RECIPIENT: YOUR_REPORT_RECIPIENT_EMAIL_HERE
    ports:
      - "YOUR_EXTERNAL_PORT:80"